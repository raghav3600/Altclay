<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="OpenClay">
  <title>OpenClay</title>
  <!--
    An open clay vessel, lid leaned against it.

    Decisions worth keeping:
      - The mouth is a genuinely dark opening. A faint tint reads as a closed
        pot; darkness is what makes "open" legible at a glance.
      - The lid is a near-circular disc, not a flat ellipse. Flat reads as a
        spout or a pooled shadow.
      - The lid face is flatly shaded with a concentric ring and a centred
        knob. A radial gradient on a circle reads as a sphere, not a lid.
      - The pot reaches the frame edges, because a favicon is judged at 16px
        and every pixel of margin is a pixel of subject lost.

    Palette is the site's vermilion rather than a generic orange.
  -->
  <defs>
    <linearGradient id="body" x1="0.12" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#E4602F"/>
      <stop offset="52%" stop-color="#CC4211"/>
      <stop offset="100%" stop-color="#9E3009"/>
    </linearGradient>
    <linearGradient id="lidFace" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#EE7A4A"/>
      <stop offset="100%" stop-color="#D04915"/>
    </linearGradient>
  </defs>

  <!-- Artwork was drawn in the upper-left of the canvas; this fits it to the
       frame so the subject, not the margin, gets the pixels. -->
  <g transform="translate(-22.2 -84.9) scale(1.14)">

  <!-- Body. -->
  <path d="
    M154,132
    C126,204 106,254 106,304
    C106,386 184,450 280,450
    C376,450 454,386 454,304
    C454,254 434,204 406,132
    Z
  " fill="url(#body)"/>

  <!-- One soft sheen; anything more is lost below 32px. -->
  <path d="
    M176,186
    C150,250 144,312 160,364
  " fill="none" stroke="#F79463" stroke-width="30" stroke-linecap="round" opacity="0.38"/>

  <!-- Rim, then the mouth. -->
  <ellipse cx="280" cy="132" rx="126" ry="30" fill="#EE7A4A"/>
  <ellipse cx="280" cy="136" rx="99" ry="21" fill="#5E1B05"/>
  <ellipse cx="280" cy="132" rx="99" ry="21" fill="#7E2708"/>

  <!-- Lid: edge for thickness, flat face, concentric ring, centred knob. -->
  <g transform="rotate(-16 112 398)">
    <ellipse cx="112" cy="409" rx="76" ry="57" fill="#8A2C0A"/>
    <ellipse cx="112" cy="398" rx="76" ry="57" fill="url(#lidFace)"/>
    <ellipse cx="112" cy="398" rx="49" ry="36" fill="none" stroke="#F79463" stroke-width="7" opacity="0.34"/>
    <ellipse cx="112" cy="396" rx="20" ry="16" fill="#F79463"/>
  </g>

  </g>
</svg>
