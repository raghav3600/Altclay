<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pot-main" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#f0863a"/>
      <stop offset="50%" stop-color="#e8732a"/>
      <stop offset="100%" stop-color="#d4621e"/>
    </linearGradient>
    <linearGradient id="pot-shadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4621e"/>
      <stop offset="100%" stop-color="#b8511a"/>
    </linearGradient>
    <linearGradient id="lid-main" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#f0863a"/>
      <stop offset="100%" stop-color="#d4621e"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9a85c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f0863a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Lid - tilted ellipse, resting in front of pot -->
  <ellipse cx="170" cy="420" rx="95" ry="28" fill="url(#pot-shadow)" transform="rotate(-12, 170, 420)"/>
  <ellipse cx="170" cy="414" rx="90" ry="24" fill="url(#lid-main)" transform="rotate(-12, 170, 414)"/>
  <ellipse cx="165" cy="411" rx="60" ry="14" fill="url(#highlight)" transform="rotate(-12, 165, 411)" opacity="0.5"/>

  <!-- Pot body -->
  <path d="
    M155,130
    C155,130 135,130 130,135
    Q90,150 75,210
    Q55,290 70,350
    Q85,400 155,420
    Q200,432 256,435
    Q312,432 357,420
    Q427,400 442,350
    Q457,290 437,210
    Q422,150 382,135
    C377,130 357,130 357,130
  " fill="url(#pot-main)"/>

  <!-- Pot rim - wide top opening -->
  <ellipse cx="256" cy="132" rx="105" ry="22" fill="url(#pot-shadow)"/>
  <ellipse cx="256" cy="128" rx="105" ry="22" fill="#f5955e"/>
  <ellipse cx="256" cy="128" rx="88" ry="16" fill="url(#pot-shadow)" opacity="0.4"/>

  <!-- Pot body highlight/sheen -->
  <path d="
    M195,180
    Q175,240 185,310
    Q190,340 210,360
  " fill="none" stroke="#f9a85c" stroke-width="14" stroke-linecap="round" opacity="0.45"/>

  <!-- Pot right shadow for depth -->
  <path d="
    M357,130
    Q422,150 437,210
    Q457,290 442,350
    Q427,400 357,420
    Q400,395 415,345
    Q435,280 420,210
    Q405,155 357,135
  " fill="#c45a1a" opacity="0.3"/>
</svg>
